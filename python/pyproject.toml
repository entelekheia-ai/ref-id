# SPDX-License-Identifier: Apache-2.0
[project]
name = "ref-id"
version = "0.6.0"
description = "The ref: identifier scheme — a Python port held to the specification's conformance vectors"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "packageurl-python>=0.17.6,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ref_id"]

[dependency-groups]
dev = [
  "pytest",
  "mypy",
  "ruff",
]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
