# Publishes @entelekheia/ref-id to the public npm registry from CI through npm trusted publishing (OIDC):
# no token is stored anywhere — npm accepts this workflow's identity, declared once on npmjs.com under the
# package's Trusted Publishers (owner entelekheia-ai, repository ref-id, workflow release.yml). Every push
# to main runs the gates; while .changeset/*.md files are pending, changesets/action opens or refreshes the
# "Version Packages" pull request instead of publishing. Merging that pull request is the release.
# The first version was published from a maintainer's terminal, because a trusted publisher can only be
# declared on a package that already exists.
name: release
on:
  push:
    branches: [main]
concurrency: release-${{ github.ref }}
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: gates — build, tests, grammar in three engines, Rust port
        run: |
          npm run build
          npm test
          npm run test:grammar
          cargo test --quiet
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
          # --no-git-tag: the action would otherwise `git push` the tag, and the repository token may not
          # push a ref whose commit touches a workflow file. The tag and the release are created below
          # through the releases API instead, which carries no such restriction.
          publish: npm run release -- --no-git-tag
          createGithubReleases: false
          title: 'Version Packages'
          commit: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Rust crate follows the same version, synced into Cargo.toml by `npm run version`, and publishes
      # through crates.io trusted publishing — declared once on crates.io, no token. The first version is
      # published from a maintainer's terminal, as with npm, because the crate must exist to be trusted.
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.changesets.outputs.published == 'true'
        id: crates
      - name: publish the crate, when the crate already exists on crates.io
        if: steps.changesets.outputs.published == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          if curl -sf -A 'entelekheia-ref-id release workflow' https://crates.io/api/v1/crates/ref-id >/dev/null; then
            cargo publish -p ref-id
          else
            echo '::warning::crate ref-id is not on crates.io yet — publish the first version from a terminal, then declare this workflow as its trusted publisher'
          fi
      # Swift Package Manager has no registry here: it resolves the package from this repository by a
      # semver tag, so every release also carries a plain `v<version>` tag beside the changesets one.
      - name: GitHub release and the two tags — the changesets one and the v<version> one SwiftPM resolves
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/ref-id/package.json').version")
          gh release create "@entelekheia/ref-id@$VERSION" --target "$GITHUB_SHA" --title "@entelekheia/ref-id@$VERSION" --notes-file <(node -e "const c=require('fs').readFileSync('packages/ref-id/CHANGELOG.md','utf8');const m=c.split(/^## /m).find(s=>s.startsWith('$VERSION'));process.stdout.write(m?m.slice(m.indexOf('\n')+1).trim():'')")
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
