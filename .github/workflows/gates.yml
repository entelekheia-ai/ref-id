# The gates, on every pull request and on main — separate from `release.yml`, which keeps its own copy
# because the checks that guard a publish must run in the job that publishes.
#
# Before this file the gates ran only on `push: main`, so a pull request had nothing checking it and the
# first run of anything was against the branch that releases. The specification is data with a sidecar
# digest, and an edit that reseals nothing is refused by the loader rather than by a vector — which shows
# up here as `npm test`, and showed up nowhere at all while this workflow did not exist.
#
# Two jobs, because each job pays its own setup and is billed rounded up to the minute, and a macOS minute
# costs ten Linux ones: everything that runs on Linux runs in one job, and the macOS job carries only what
# needs Swift — the conformance runner and the differential, which share one Swift build. The conformance
# runner is the only thing that exercises the Swift port's vectors; it is an executable rather than a test
# target on purpose (see Package.swift): it runs on a toolchain with no XCTest.
name: gates
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-and-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, because the commit gate reads it: the `breadcrumb` gate resolves the
          # `git show <sha>:<path>` a plan in progress carries once its task dossiers close before it,
          # and a depth-1 clone holds none of those commits. Shipped plans are outside the gate.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: dtolnay/rust-toolchain@stable
      # target/, keyed on the toolchain and Cargo.lock: a warm run rebuilds only what changed.
      - uses: Swatinem/rust-cache@v2
      # uv on this runner is what lets the python-conformance gate run rather than skip.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: npm ci
      - name: the commit gate, run the way the hook runs it
        # Ahead of the suite because the specification's own rules live here: the sidecar seal (the
        # failure that otherwise arrives as six unrelated-looking errors, and the one drift the copy gate
        # cannot see), the relate vectors reducing to what the comparison vectors say, and the openRPC
        # document staying valid and tied to the rules and vectors it names. They are local gates under
        # .vibe-ops/, composed by vibeops.config.ts; they read the source, so no build is needed yet.
        #
        # The CLI itself is pinned; its own dependencies (core, the gates) resolve by caret range at install
        # time, so a patch release of those can still move what runs here. The pin bounds the drift, it
        # does not freeze it.
        #
        # A SKIP of one of this repository's own gates FAILS here. A gate skips only when its instrument is
        # absent (a Node without type stripping, a devDependency not installed), and a non-verbose run
        # prints nothing for a skip — so without this step, a dependency dropped from package.json would
        # turn the OpenRPC check off while every line of this workflow stayed green.
        run: |
          npm i -g @entelekheia/vibe-ops-cli@0.2.0
          vibe-ops check --self-test
          # The verdict is the exit code; the skip test reads `skipped[].check` from --json, never the text
          # layout. Output that is not JSON (the gate could not run) prints whole.
          rc=0; out=$(vibe-ops check --json) || rc=$?
          printf '%s\n' "$out" | RC=$rc node -e '
            let d = ""; process.stdin.on("data", (c) => (d += c)).on("end", () => {
              let j; try { j = JSON.parse(d) } catch { console.log(d); process.exit(1) }
              for (const f of j.findings ?? []) if (f.level === "fail" || f.level === "warn")
                console.log(`${f.level.toUpperCase().padEnd(5)} [${f.check}] ${f.evidence}`)
              if (process.env.RC !== "0") process.exit(1)
              const own = ["spec-sealed", "relate-consistent", "openrpc-valid", "python-conformance", "surface-generated"]
              const hit = (j.skipped ?? []).filter((s) => own.includes(s.check))
              for (const s of hit) console.error(`SKIP  [${s.check}] ${s.reason}`)
              if (hit.length) {
                console.error("one of this repository\x27s own gates skipped — its instrument is missing on this runner")
                process.exit(1)
              }
            })'
          npm run test:gates
      - name: build, tests, the pcre2 grammar runner, Rust port
        # typecheck is what holds the TypeScript surface to openRPC by signature: the generated
        # test/surface.generated.ts is checked by tsc alone, and `npm test` strips types without checking
        # them, so without this line a narrowed parameter or a changed return type merges green.
        run: |
          npm run build
          npm run typecheck
          npm test
          npm run test:grammar
          cargo test --quiet
          node --test scripts/gen-surface-python.test.mjs
      - name: the identify skill's script resolves a corpus without leaking the caller's environment
        run: npm run test:identify
      # The commit gate above already ran the Python suite on the newest interpreter, through
      # python-conformance. This adds the oldest one the port supports, the type check over every test
      # file (test_surface.py holds the port to openRPC by signature) and the linter; `--locked` refuses a
      # python/uv.lock that no longer matches python/pyproject.toml.
      - name: the Python port on 3.11, its types and its lint
        working-directory: python
        run: |
          uv run --locked --python 3.11 pytest -q
          uv run --locked mypy --strict src tests
          uv run --locked ruff check

  # The only job where every implementation can run, because Swift needs macOS and the differential
  # needs them all on one machine; the Swift conformance runner rides along on its build. Each suite proves its own implementation agrees with the
  # specification; none of them proves the four agree with *each other*, and a field no vector
  # constrains can be decided three ways with every suite green — which is what happened to Package URL
  # canonicalisation for as long as the line protocol dropped that field.
  differential:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: dtolnay/rust-toolchain@stable
      # target/, keyed on the toolchain and Cargo.lock: a warm run rebuilds only what changed.
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - run: npm ci
      - name: every implementation answers the same for every input the specification names
        run: npm run test:differential
      # Each suite fails when a declared method is missing or its signature moved; none of them can see
      # a public function nobody declared. This reads Rust through tree-sitter and Swift through its
      # compiler's symbol graph and Python through `ref_id.__all__`, which is why it runs here, beside the
      # Swift toolchain.
      - name: no implementation exposes a public function the specification does not declare
        run: npm run test:surface
      # After the differential, which has already built this executable, so the run reuses that build.
      # It runs when the differential failed too, so a Swift conformance failure is never hidden behind it.
      - name: swift conformance
        if: success() || failure()
        run: swift run ref-id-conformance
